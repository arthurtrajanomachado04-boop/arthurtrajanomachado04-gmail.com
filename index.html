<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arthur — Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0c; --panel:#141418; --line:#26262d; --ink:#f5f5f7; --muted:#9a9aa6; --pink:#19e6b8; --teal:#19e6b8; --wa:#25d366;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:300 18px/1.6 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 22px}
nav{padding:20px 0;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.7rem;letter-spacing:-.03em}
.logo b{color:var(--pink);font-weight:800}
.hero{padding:44px 0 56px;background:radial-gradient(120% 60% at 50% 0,#0a3a2e 0,transparent 70%)}
.tag{display:inline-block;border:1px solid #0d5e4b;background:#082a22;color:var(--pink);border-radius:999px;padding:8px 18px;font-size:.9rem}
h1{font-weight:500;font-size:clamp(2.5rem,11vw,4.4rem);line-height:1.02;letter-spacing:-.035em;margin:26px 0 0}
h1 b{color:var(--pink);font-weight:800}
.lead{color:var(--muted);margin:24px 0 0;max-width:36ch}
.btn{display:flex;justify-content:space-between;align-items:center;margin-top:30px;background:var(--pink);color:#04130e;text-decoration:none;font-weight:500;padding:20px 26px;border-radius:16px}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);margin-top:12px}
.note{color:var(--muted);font-size:.9rem;margin:12px 0 0}
.photo{margin:40px 0 0;border-radius:28px;border:1px solid #0d5e4b;background:linear-gradient(160deg,#0a3a2e,#141418);box-shadow:0 0 60px rgba(25,230,184,.22);overflow:hidden;aspect-ratio:3/2}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;padding:44px 0;border-top:1px solid var(--line)}
.stats strong{display:block;font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
